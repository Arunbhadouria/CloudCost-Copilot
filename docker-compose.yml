version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: cloudcost-db
    environment:
      POSTGRES_USER: cloudcost
      POSTGRES_PASSWORD: cloudcost
      POSTGRES_DB: cloudcost
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcost"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudcost-api
    environment:
      DATABASE_URL: postgresql+psycopg://cloudcost:cloudcost@db:5432/cloudcost
      LLM_MODE: ${LLM_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEFAULT_SEED: ${DEFAULT_SEED:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cloudcost-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:

